<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Actualizando Sistema | MásKFundas</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --border: #334155;
      --primary: #3b82f6;
      --primary-glow: rgba(59, 130, 246, 0.4);
      --text: #f8fafc;
      --text-muted: #94a3b8;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      overflow: hidden;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 40px 32px;
      max-width: 460px;
      width: 100%;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
      position: relative;
    }
    .logo-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 64px;
      height: 64px;
      border-radius: 16px;
      background: linear-gradient(135deg, #1e3a8a, #3b82f6);
      color: white;
      margin-bottom: 24px;
      box-shadow: 0 8px 24px var(--primary-glow);
    }
    .logo-badge svg {
      width: 32px;
      height: 32px;
      animation: spin 3s linear infinite;
    }
    h1 {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 12px;
      color: var(--text);
    }
    p {
      font-size: 14px;
      color: var(--text-muted);
      line-height: 1.6;
      margin-bottom: 24px;
    }
    .progress-bar-container {
      width: 100%;
      height: 6px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 3px;
      overflow: hidden;
      margin-bottom: 16px;
    }
    .progress-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #3b82f6, #60a5fa);
      border-radius: 3px;
      animation: load 2.5s ease-in-out forwards;
    }
    .countdown-text {
      font-size: 12px;
      color: var(--text-muted);
      font-weight: 500;
    }
    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    @keyframes load {
      0% { width: 5%; }
      50% { width: 70%; }
      100% { width: 100%; }
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo-badge">
      <svg fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
      </svg>
    </div>
    <h1>Actualizando el portal...</h1>
    <p>Estamos aplicando mejoras en el sistema. Reconectando automáticamente en unos instantes sin perder tu sesión.</p>
    <div class="progress-bar-container">
      <div class="progress-bar"></div>
    </div>
    <div class="countdown-text">Reanudando en <span id="secs">2</span> segundos...</div>
  </div>

  <script>
    let s = 2;
    const el = document.getElementById('secs');
    const interval = setInterval(() => {
      s--;
      if (el && s >= 0) el.textContent = s;
      if (s <= 0) {
        clearInterval(interval);
        window.location.reload();
      }
    }, 1000);

    // Fallback de seguridad si el temporizador se retrasa
    setTimeout(() => {
      window.location.reload();
    }, 2800);
  </script>
</body>
</html>
