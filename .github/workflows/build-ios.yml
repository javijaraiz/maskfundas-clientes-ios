name: Build & Upload iOS IPA (TestFlight & App Store)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-and-upload:
    name: Build & Upload iOS App
    runs-on: macos-latest # Standard Apple Silicon runner

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install NPM Dependencies
        run: |
          npm install

      - name: Sync Capacitor iOS Platform
        run: |
          npx cap sync ios

      - name: Configure App Store Connect API Key
        env:
          API_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys ~/.private_keys
          echo "$API_KEY_P8" > ~/.appstoreconnect/private_keys/AuthKey_${API_KEY_ID}.p8
          cp ~/.appstoreconnect/private_keys/AuthKey_${API_KEY_ID}.p8 ~/.private_keys/

      - name: Set up Keychain & Install Certificates
        env:
          BUILD_KEYCHAIN_PASSWORD: "temporary_build_pwd_123"
          CERT_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          CERT_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          PROV_PROFILE: ${{ secrets.APPLE_PROVISIONING_PROFILE }}
        run: |
          # Create temporary keychain
          security create-keychain -p "$BUILD_KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$BUILD_KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -lut 3600 build.keychain

          # Install the profile configured in GitHub when available. The checked-in
          # profile is a fallback for older repository setups, but must include
          # Associated Domains for passkeys to work in the iOS app.
          PROFILE_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILE_DIR"
          PROFILE_PATH="$RUNNER_TEMP/app-store-profile.mobileprovision"

          USE_FALLBACK=1
          if [ -n "$PROV_PROFILE" ]; then
            printf '%s' "$PROV_PROFILE" | base64 --decode > "$PROFILE_PATH" 2>/dev/null || printf '%s' "$PROV_PROFILE" > "$PROFILE_PATH"
            CHECK_PLIST="$RUNNER_TEMP/check-profile.plist"
            if security cms -D -i "$PROFILE_PATH" > "$CHECK_PLIST" 2>/dev/null; then
              APP_ID=$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$CHECK_PLIST" 2>/dev/null || echo "")
              if echo "$APP_ID" | grep -q "com.dowisp.com"; then
                echo "Using matching com.dowisp.com profile from secret."
                USE_FALLBACK=0
              else
                echo "Secret profile is for $APP_ID (not com.dowisp.com). Using checked-in repository profile."
              fi
            fi
          fi

          if [ "$USE_FALLBACK" -eq 1 ]; then
            cp ios/App/MasKFundas_com_dowisp_com_App_Store_Profile.mobileprovision "$PROFILE_PATH"
          fi

          PROFILE_PLIST="$RUNNER_TEMP/app-store-profile.plist"
          security cms -D -i "$PROFILE_PATH" > "$PROFILE_PLIST"
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$PROFILE_PLIST")
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c 'Print :Name' "$PROFILE_PLIST")
          cp "$PROFILE_PATH" "$PROFILE_DIR/"
          cp "$PROFILE_PATH" "$PROFILE_DIR/$PROFILE_UUID.mobileprovision"
          echo "IOS_PROFILE_UUID=$PROFILE_UUID" >> "$GITHUB_ENV"
          echo "IOS_PROFILE_NAME=$PROFILE_NAME" >> "$GITHUB_ENV"
          echo "Provisioning profile installed to ~/Library/MobileDevice/Provisioning Profiles/: $PROFILE_NAME ($PROFILE_UUID)"
          ls -la ~/Library/MobileDevice/Provisioning\ Profiles/

          # Import .p12 into keychain (with legacy 3DES fallback)
          echo "$CERT_P12" | base64 --decode > certificate.p12
          if ! security import certificate.p12 -k build.keychain -P "$CERT_PASSWORD" -A; then
            echo "Direct import failed, converting to legacy 3DES..."
            openssl pkcs12 -in certificate.p12 -out cert_and_key.pem -nodes -passin pass:"$CERT_PASSWORD"
            openssl pkcs12 -export -in cert_and_key.pem -out legacy_cert.p12 -passout pass:"$CERT_PASSWORD" -keypbe PBE-SHA1-3DES -certpbe PBE-SHA1-3DES -macalg sha1
            security import legacy_cert.p12 -k build.keychain -P "$CERT_PASSWORD" -A
          fi
          security set-key-partition-list -S apple-tool:,apple: -s -k "$BUILD_KEYCHAIN_PASSWORD" build.keychain

      - name: Build Xcode Archive
        run: |
          cd ios/App
          xcodebuild -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/App.xcarchive \
            archive \
            DEVELOPMENT_TEAM="UNAJ7R44N2" \
            CODE_SIGN_STYLE="Manual" \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="$IOS_PROFILE_UUID"

      - name: Export App Store IPA
        run: |
          cd ios/App
          EXPORT_OPTIONS="$RUNNER_TEMP/ExportOptions.plist"
          cp ExportOptions.plist "$EXPORT_OPTIONS"
          /usr/libexec/PlistBuddy -c "Set :provisioningProfiles:com.dowisp.com $IOS_PROFILE_UUID" "$EXPORT_OPTIONS"
          xcodebuild -exportArchive \
            -archivePath build/App.xcarchive \
            -exportOptionsPlist "$EXPORT_OPTIONS" \
            -exportPath build/out

      - name: Upload IPA Artifact to GitHub
        uses: actions/upload-artifact@v4
        with:
          name: maskfundas-clientes-ios-ipa
          path: ios/App/build/out/*.ipa

      - name: Upload to TestFlight & App Store Connect
        env:
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
        run: |
          cd ios/App
          IPA_PATH=$(ls build/out/*.ipa | head -n 1)
          echo "Subiendo $IPA_PATH a App Store Connect con altool..."
          set +e
          UPLOAD_OUTPUT=$(xcrun altool --upload-app \
            -f "$IPA_PATH" \
            -t ios \
            --apiKey "$API_KEY_ID" \
            --apiIssuer "$API_ISSUER_ID" 2>&1)
          STATUS=$?
          echo "$UPLOAD_OUTPUT"
          echo "### Resultado Subida App Store Connect" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "$UPLOAD_OUTPUT" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          exit $STATUS
