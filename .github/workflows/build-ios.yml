name: Build & Upload iOS IPA (TestFlight & App Store)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-and-upload:
    name: Build & Upload iOS App
    runs-on: macos-15 # Apple Silicon runner locked to macOS 15 Sequoia

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install NPM Dependencies
        run: |
          npm install

      - name: Sync Capacitor iOS Platform
        run: |
          npx cap sync ios

      - name: Configure App Store Connect API Key
        env:
          API_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys ~/.private_keys
          echo "$API_KEY_P8" > ~/.appstoreconnect/private_keys/AuthKey_${API_KEY_ID}.p8
          cp ~/.appstoreconnect/private_keys/AuthKey_${API_KEY_ID}.p8 ~/.private_keys/

      - name: Set up Keychain & Install Certificates
        env:
          BUILD_KEYCHAIN_PASSWORD: "temporary_build_pwd_123"
          CERT_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          CERT_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          PROV_PROFILE: ${{ secrets.APPLE_PROVISIONING_PROFILE }}
        run: |
          # Create temporary keychain
          security create-keychain -p "$BUILD_KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$BUILD_KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -lut 3600 build.keychain

          # Install Provisioning Profile
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$PROV_PROFILE" | base64 --decode > ~/Library/MobileDevice/Provisioning\ Profiles/MasKFundas_Clientes_App_Store_Profile.mobileprovision
          # Also copy as UUID filename
          UUID=$(/usr/libexec/PlistBuddy -c "Print :UUID" /dev/stdin <<< $(security cms -D -i ~/Library/MobileDevice/Provisioning\ Profiles/MasKFundas_Clientes_App_Store_Profile.mobileprovision) 2>/dev/null || echo "e10db9df-1438-4ee3-a9c1-73efc7a37bc9")
          cp ~/Library/MobileDevice/Provisioning\ Profiles/MasKFundas_Clientes_App_Store_Profile.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/${UUID}.mobileprovision

          # Import .p12 into keychain (with legacy 3DES fallback)
          echo "$CERT_P12" | base64 --decode > certificate.p12
          if ! security import certificate.p12 -k build.keychain -P "$CERT_PASSWORD" -A; then
            echo "Direct import failed, converting to legacy 3DES..."
            openssl pkcs12 -in certificate.p12 -out cert_and_key.pem -nodes -passin pass:"$CERT_PASSWORD"
            openssl pkcs12 -export -in cert_and_key.pem -out legacy_cert.p12 -passout pass:"$CERT_PASSWORD" -keypbe PBE-SHA1-3DES -certpbe PBE-SHA1-3DES -macalg sha1
            security import legacy_cert.p12 -k build.keychain -P "$CERT_PASSWORD" -A
          fi
          security set-key-partition-list -S apple-tool:,apple: -s -k "$BUILD_KEYCHAIN_PASSWORD" build.keychain

      - name: Build Xcode Archive
        run: |
          cd ios/App
          xcodebuild -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/App.xcarchive \
            archive \
            CODE_SIGN_STYLE="Manual" \
            PROVISIONING_PROFILE_SPECIFIER="MasKFundas Clientes App Store Profile" \
            CODE_SIGN_IDENTITY="Apple Distribution"

      - name: Export App Store IPA
        run: |
          cd ios/App
          xcodebuild -exportArchive \
            -archivePath build/App.xcarchive \
            -exportOptionsPlist ExportOptions.plist \
            -exportPath build/out

      - name: Upload IPA Artifact to GitHub
        uses: actions/upload-artifact@v4
        with:
          name: maskfundas-clientes-ios-ipa
          path: ios/App/build/out/*.ipa

      - name: Upload to TestFlight & App Store Connect
        env:
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
        run: |
          cd ios/App
          IPA_PATH=$(ls build/out/*.ipa | head -n 1)
          echo "Subiendo $IPA_PATH a App Store Connect..."
          xcrun altool --upload-app \
            -f "$IPA_PATH" \
            -t ios \
            --apiKey "$API_KEY_ID" \
            --apiIssuer "$API_ISSUER_ID"
